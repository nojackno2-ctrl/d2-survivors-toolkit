[package]
name = "d2-toolkit-launcher"
version = "1.0.13"
edition = "2021"
description = "D2倖存者工具包桌面啟動器（Rust）：介面與引擎從 GitHub Pages 線上載入，本機只負責存檔讀寫"

[[bin]]
name = "d2-toolkit"
path = "src/main.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
muda = "0.21"
rusty-leveldb = "4"
ureq = { version = "3", default-features = false, features = ["gzip", "native-tls-no-default"] }
rfd = "0.18"
sys-locale = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
open = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
